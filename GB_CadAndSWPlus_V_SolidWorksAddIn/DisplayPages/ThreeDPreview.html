<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#ddd;font:12px sans-serif}#message{position:absolute;left:8px;top:8px;z-index:2}canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
<div id="message">正在加载三维预览...</div>
<script type="importmap">
{
  "imports": {
    "three": "./three/three.module.js"
  }
}
</script>
<script type="module">
const message = document.getElementById('message');
const params = new URLSearchParams(location.search);
const modelUrl = params.get('model');
if (!modelUrl) { message.textContent = '未提供三维预览文件。'; }
else {
  try {
    const THREE = await import('./three/three.module.js');
    const { OrbitControls } = await import('./three/examples/jsm/controls/OrbitControls.js');
    const { GLTFLoader } = await import('./three/examples/jsm/loaders/GLTFLoader.js');
    const { DRACOLoader } = await import('./three/examples/jsm/loaders/DRACOLoader.js');
    const scene = new THREE.Scene(); scene.background = new THREE.Color(0x111111);
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 1000); camera.position.set(2, 2, 2);
    const renderer = new THREE.WebGLRenderer({ antialias:true }); renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2)); const light = new THREE.DirectionalLight(0xffffff, 2); light.position.set(2,4,3); scene.add(light);
    const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('./three/draco/');
    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);
    gltfLoader.load(modelUrl, gltf => { scene.add(gltf.scene); message.textContent = '拖动旋转，滚轮缩放。'; }, undefined, error => { message.textContent = '三维预览加载失败：' + error; });
    addEventListener('resize', () => { camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
    (function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); })();
  } catch (error) { message.textContent = '三维查看器初始化失败：' + (error && error.message ? error.message : error); }
}
</script>
</body>
</html>
